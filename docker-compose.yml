services:
  digest:
    build: .
    env_file:
      - .env
    environment:
      DB_PATH: /app/data/pipeline.db
    volumes:
      - ./data:/app/data
    # main.py는 실행 후 종료되는 배치 잡이므로 `docker compose up`으로 상시
    # 띄워둘 필요가 없다. 스케줄 실행은 호스트 cron이 아래 명령을 주기 호출한다:
    #   docker compose run --rm digest
    # 파라미터를 바꾸고 싶으면:
    #   docker compose run --rm digest --keyword "AI" --days 1
